<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDS Contratistas</title>
</head>

<body>

<h1>DDS Contratistas</h1>

<h3>Ingrese sus datos</h3>


<input id="dni" placeholder="DNI"><br><br>
<input id="password" type="password" placeholder="Contraseña"><br><br>

<button onclick="login()">Ingresar</button>

<hr>

<!-- CONTENIDO DDS -->
<div id="contenidoDDS" style="display:none;">

    <h2 id="tituloDDS"></h2>

    <a id="pdfLink" href="#" target="_blank">
        📄 Abrir documento DDS
    </a>

    <h3>Evaluación</h3>
    <div id="preguntas"></div>


    <!-- Botón Enviar Evaluación -->
    <br><br>
    <button onclick="enviarEvaluacion()">Enviar evaluación</button>

    <div id="resultado" style="margin-top:20px; font-weight:bold;"></div>
</div>

<script>

// ==========================================
// LOGIN USUARIO
// ==========================================
async function login() {

    let dni = document.getElementById("dni").value;
    let password = document.getElementById("password").value;

    if (!dni || !password) {
        alert("⚠️ Ingresar DNI y contraseña");
        return;
    }

    try {

        let response = await fetch("https://default31211f7f7b404585b6ebb1270b0e63.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d15ee016a38445a6b81f5dc16625d6dd/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OeVFy8wx2kScvPORJmz5ocRNfUQcC8mwrdKfpE5RVGk", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                dni: dni,
                password: password
            })
        });

        let data = await response.json();

        if (!data.ok) {
            alert("❌ DNI o contraseña incorrectos");
            return;
        }

        // ✅ Guardar usuario logueado
        window.usuario = data.usuario;

        // ✅ Mostrar mensaje
        alert("Bienvenido: " + data.usuario.NombreCompleto);

        // ✅ Ahora sí cargar DDS
        cargarDDS();

    } catch (error) {
        console.error(error);
        alert("Error al iniciar sesión");
    }
}
    
// ==========================================
// URL DEL FLOW (PEGAR LA REAL AQUÍ)
// ==========================================
const flowObtener = "https://default31211f7f7b404585b6ebb1270b0e63.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e89f09c980424dbc968d85ff199b0815/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=P1YgIP0x2fSvdXWtEASRj-nUJhhmiKc3HDzkh1NxJ4A";

// Variables globales
let preguntasData = []; 
let ordenDDS = 0; // para almacenar el DDS actual

// ==========================================
// FUNCIÓN CARGAR DDS
// ==========================================
async function cargarDDS() {

    // --------------------------------------
    // Obtener datos del usuario
    // --------------------------------------
    let nombre = document.getElementById("nombre").value;
    let dni = document.getElementById("dni").value;

    // --------------------------------------
    // Validación básica
    // --------------------------------------
    if (!nombre || !dni) {
        alert("⚠️ Debe ingresar nombre y DNI");
        return;
    }

    try {

        // --------------------------------------
        // LLAMADA A POWER AUTOMATE (HTTP POST)
        // --------------------------------------
        let response = await fetch(flowObtener, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                nombre: nombre,
                dni: dni
            })
        });

        // --------------------------------------
        // Convertir respuesta a JSON
        // --------------------------------------
        let data = await response.json();

        console.log("Respuesta del Flow:", data); // <-- PARA DEBUG

        // --------------------------------------
        // Guardar datos
        // --------------------------------------
        ordenDDS = data.ordenDDS;
        preguntasData = data.preguntas;

        // --------------------------------------
        // Mostrar DDS
        // --------------------------------------
        document.getElementById("contenidoDDS").style.display = "block";
        document.getElementById("tituloDDS").innerText = data.titulo;
        document.getElementById("pdfLink").href = data.pdf;
        
        // Renderizar preguntas
        renderPreguntas();

    } catch (error) {

        // --------------------------------------
        // Mostrar error en consola
        // --------------------------------------
        console.error("Error:", error);

        alert("❌ Error al cargar capacitación");

    }
}

// ==========================================
// GENERAR PREGUNTAS DINÁMICAMENTE
// ==========================================
function renderPreguntas() {

    let contenedor = document.getElementById("preguntas");
    contenedor.innerHTML = "";

    preguntasData.forEach((p, i) => {

        let texto = p.TextoPregunta;
        let opciones = p.Opciones.split(","); // Clave

        let html = `<p><b>${texto}</b></p>`;

        opciones.forEach(op => {

            let opcionLimpia = op.trim(); // Elimina espacios

            html += `
                <input type="radio" name="p${i}" value="${opcionLimpia}">
                ${opcionLimpia}<br>
            `;
        });

        contenedor.innerHTML += html;
    });
}


// ==========================================
// CALCULAR PUNTAJE
// ==========================================
function calcularResultado() {

    let correctas = 0;
    let idsCorrectas = [];

    preguntasData.forEach((p, i) => {

        // Obtener la respuesta seleccionada
        let seleccion = document.querySelector(`input[name="p${i}"]:checked`);

        if (seleccion) {

            let respuestaUsuario = seleccion.value.trim();
            let respuestaCorrecta = p.OpcionCorrecta.trim();

            // Comparar
            if (respuestaUsuario === respuestaCorrecta) {
                correctas++;

                // Guardar IDPregunta (para CSV)
                idsCorrectas.push(p.IDPregunta);
            }
        }
    });

    let total = preguntasData.length;
    let puntaje = Math.round((correctas / total) * 100);

    return {
        puntaje,
        aprobado: puntaje >= 70,
        correctasCSV: idsCorrectas.join(",")
    };
}


// ==========================================
// ENVIAR EVALUACIÓN AL FLOW
// ==========================================
async function enviarEvaluacion() {
    let boton = document.querySelector("button[onclick='enviarEvaluacion()']");
    boton.disabled = true;

    let nombre = document.getElementById("nombre").value;
    let dni = document.getElementById("dni").value;

    // Validar que se respondan todas
    let respondidas = document.querySelectorAll("input[type=radio]:checked").length;

    if (respondidas !== preguntasData.length) {
        alert("⚠️ Debe responder todas las preguntas");
        return;
    }

    // Calcular resultado
    let resultado = calcularResultado();

    //alert("Puntaje: " + resultado.puntaje + "%");
    let divResultado = document.getElementById("resultado");
    
    divResultado.innerHTML = `
        Puntaje: ${resultado.puntaje}% <br>
        Estado: ${resultado.aprobado ? "✅ APROBADO" : "❌ DESAPROBADO"}
    `;
    
    divResultado.style.color = resultado.aprobado ? "green" : "red";

    try {

        // Llamar al Flow
        await fetch("https://default31211f7f7b404585b6ebb1270b0e63.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1c9b50bc1e0a40b4bfcc513a431ac0a3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=FERZ-H9x79ChFuybsNSsebkbpgnMicZFA-zBeCndY48", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },
            
            body: JSON.stringify({
                nombre: nombre,
                dni: dni,
                ordenDDS: parseInt(ordenDDS),   // CLAVE
                puntaje: resultado.puntaje,
                aprobado: resultado.aprobado,
                correctas: resultado.correctasCSV
            })

        });

        // Resultado final
        if (resultado.aprobado) {
            alert("✅ APROBADO");
            //location.reload(); // pasa al siguiente DDS
            setTimeout(() => cargarDDS(), 2000);
        } else {
            alert("❌ DESAPROBADO - Puede volver a intentar");
        }

    } catch (error) {

        console.error(error);
        alert("Error al enviar evaluación");

    }
}
    
</script>

</body>
</html>
