<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDS Contratistas</title>
</head>

<body>

<h1>DDS Contratistas</h1>

<h3>Ingrese sus datos</h3>

<input id="nombre" placeholder="Nombre completo"><br><br>
<input id="dni" placeholder="DNI"><br><br>

<button onclick="cargarDDS()">Cargar DDS</button>

<hr>

<!-- CONTENIDO DDS -->
<div id="contenidoDDS" style="display:none;">

    <h2 id="tituloDDS"></h2>

    <a id="pdfLink" href="#" target="_blank">
        📄 Abrir documento DDS
    </a>

</div>

<script>

// ==========================================
// URL DEL FLOW (PEGAR LA REAL AQUÍ)
// ==========================================
const flowObtener = "https://default31211f7f7b404585b6ebb1270b0e63.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e89f09c980424dbc968d85ff199b0815/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=P1YgIP0x2fSvdXWtEASRj-nUJhhmiKc3HDzkh1NxJ4A";

// Variable global para guardar el DDS actual
let ordenDDS = 0;


// ==========================================
// FUNCIÓN CARGAR DDS
// ==========================================
async function cargarDDS() {

    // --------------------------------------
    // Obtener datos del usuario
    // --------------------------------------
    let nombre = document.getElementById("nombre").value;
    let dni = document.getElementById("dni").value;

    // --------------------------------------
    // Validación básica
    // --------------------------------------
    if (!nombre || !dni) {
        alert("⚠️ Debe ingresar nombre y DNI");
        return;
    }

    try {

        // --------------------------------------
        // LLAMADA A POWER AUTOMATE (HTTP POST)
        // --------------------------------------
        let response = await fetch(flowObtener, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                nombre: nombre,
                dni: dni
            })

        });

        // --------------------------------------
        // Convertir respuesta a JSON
        // --------------------------------------
        let data = await response.json();

        console.log("Respuesta del Flow:", data); // <-- PARA DEBUG

        // --------------------------------------
        // Guardar el orden DDS
        // --------------------------------------
        ordenDDS = data.ordenDDS;

        // --------------------------------------
        // Mostrar contenido DDS
        // --------------------------------------
        document.getElementById("contenidoDDS").style.display = "block";

        // --------------------------------------
        // Mostrar título del DDS
        // --------------------------------------
        document.getElementById("tituloDDS").innerText = data.titulo;

        // --------------------------------------
        // Mostrar PDF
        // --------------------------------------
        document.getElementById("pdfLink").href = data.pdf;

    } catch (error) {

        // --------------------------------------
        // Mostrar error en consola
        // --------------------------------------
        console.error("Error:", error);

        alert("❌ Error al conectar con el servidor");

    }
}

</script>

</body>
</html>
