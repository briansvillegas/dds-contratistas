<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDS Contratistas</title>
</head>

<body>

<h1>DDS Contratistas</h1>

<h3>Ingrese sus datos</h3>

<input id="nombre" placeholder="Nombre completo"><br><br>
<input id="dni" placeholder="DNI"><br><br>

<button onclick="cargarDDS()">Cargar DDS</button>

<hr>

<!-- CONTENIDO DDS -->
<div id="contenidoDDS" style="display:none;">

    <h2 id="tituloDDS"></h2>

    <a id="pdfLink" href="#" target="_blank">
        📄 Abrir documento DDS
    </a>

</div>

<script>

// ==========================
// FUNCIÓN CARGAR DDS
// ==========================
function cargarDDS() {

    let nombre = document.getElementById("nombre").value;
    let dni = document.getElementById("dni").value;

    // Validación básica
    if (!nombre || !dni) {
        alert("Ingresá nombre y DNI");
        return;
    }

    // Simulación (todavía sin Power Automate)
    let titulo = "DDS 1 - Uso correcto de EPP";
    let pdf = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";

    // Mostrar contenido
    document.getElementById("contenidoDDS").style.display = "block";

    // Setear datos
    document.getElementById("tituloDDS").innerText = titulo;
    document.getElementById("pdfLink").href = pdf;
}

</script>

</body>
</html>
